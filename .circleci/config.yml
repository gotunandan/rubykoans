version: 2.1

jobs:
  say-hello:
    machine:
      image: ubuntu-2204:current
    resource_class: medium
    steps:
      - checkout
      - run:
          name: "Say hello"
          command: "echo Hello, World! ; free -h ; lscpu ; cat /etc/os-release ; uname ; date"

workflows:
  say-hello-workflow:
    jobs:
      - say-hello
